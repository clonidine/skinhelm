<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skinhelm</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090c;
        --panel: rgba(255, 255, 255, 0.055);
        --panel-strong: rgba(14, 14, 14, 0.9);
        --border: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.24);
        --text-primary: #f7f7f7;
        --text-muted: rgba(255, 255, 255, 0.56);
        --success: #75f0a0;
        --shadow-panel: 0 24px 80px rgba(0, 0, 0, 0.48);
        --font-heading: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
        --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --transition-fast: 180ms ease-out;
        font-family:
          "IBM Plex Sans", "Segoe UI", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        background: var(--bg);
        color: var(--text-primary);
      }

      * {
        box-sizing: border-box;
      }

      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-primary);
        line-height: 1.5;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      button,
      input {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.86);
        outline-offset: 2px;
      }

      .app-shell {
        position: relative;
        min-height: 100dvh;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        background: var(--bg);
      }

      .viewer-topbar {
        position: absolute;
        inset: 0 0 auto;
        z-index: 4;
        display: grid;
        grid-template-columns: minmax(0, auto) minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        height: clamp(58px, 7vh, 76px);
        padding:
          env(safe-area-inset-top, 0)
          calc(clamp(16px, 3vw, 30px) + env(safe-area-inset-right, 0))
          0
          calc(clamp(16px, 3vw, 30px) + env(safe-area-inset-left, 0));
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.82), transparent);
        pointer-events: none;
      }

      .brand-block {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: max-content;
      }

      .brand-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 50%;
      }

      .brand-mark::before,
      .brand-mark::after,
      .brand-mark span {
        content: "";
        position: absolute;
        background: #fff;
      }

      .brand-mark::before {
        left: 50%;
        top: -10%;
        width: 4px;
        height: 120%;
        border-radius: 999px;
        transform: translateX(-50%) rotate(42deg);
      }

      .brand-mark::after {
        right: 12%;
        bottom: 18%;
        width: 32%;
        height: 10%;
        border-radius: 999px;
        transform: rotate(-22deg);
      }

      .brand-mark span {
        left: 13%;
        top: 34%;
        width: 38%;
        height: 12%;
        border-radius: 999px;
        transform: rotate(20deg);
      }

      .brand-copy {
        display: grid;
        gap: 1px;
      }

      .brand-copy strong {
        color: #fff;
        font-family: var(--font-heading);
        font-size: 1.08rem;
        font-weight: 700;
        line-height: 1;
      }

      .brand-copy span {
        color: var(--text-muted);
        font-size: 0.76rem;
        font-weight: 600;
      }

      .viewer-stage {
        position: relative;
        min-height: 100dvh;
        height: var(--app-height, 100dvh);
        overflow: hidden;
      }

      #viewer-canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #101216;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #status {
        justify-self: end;
        max-width: min(58vw, 520px);
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.36);
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity var(--transition-fast),
          transform var(--transition-fast);
      }

      #status[data-visible="false"] {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
      }

      .control-dock {
        position: absolute;
        left: 50%;
        bottom: calc(clamp(18px, 4vh, 38px) + env(safe-area-inset-bottom, 0));
        z-index: 3;
        display: grid;
        gap: 12px;
        width: min(
          980px,
          calc(100vw - 32px - env(safe-area-inset-left, 0) - env(safe-area-inset-right, 0))
        );
        transform: translateX(-50%);
      }

      html[data-dock="closed"] .control-dock {
        display: none;
      }

      .dock-toggle {
        position: absolute;
        right: clamp(16px, 3vw, 30px);
        bottom: calc(clamp(18px, 4vh, 38px) + env(safe-area-inset-bottom, 0));
        z-index: 4;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.055);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 16px 44px rgba(0, 0, 0, 0.36);
        cursor: pointer;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition:
          transform var(--transition-fast),
          border-color var(--transition-fast),
          background-color var(--transition-fast);
      }

      .dock-toggle:hover {
        border-color: rgba(255, 255, 255, 0.34);
        background: rgba(255, 255, 255, 0.09);
        transform: translateY(-1px);
      }

      .dock-toggle::before,
      .dock-toggle::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        transition: transform var(--transition-fast);
      }

      .dock-toggle::before {
        transform: translateY(-3px);
      }

      .dock-toggle::after {
        transform: translateY(3px);
      }

      html[data-dock="closed"] .dock-toggle::before {
        transform: rotate(90deg);
      }

      html[data-dock="closed"] .dock-toggle::after {
        transform: rotate(0deg);
      }

      html[data-dock="open"] .dock-toggle {
        bottom: calc(clamp(18px, 4vh, 38px) + env(safe-area-inset-bottom, 0) + 76px);
      }

      .control-pill {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 68px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          var(--shadow-panel);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }

      .button,
      .file-button,
      .player-input {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--text-primary);
        font-weight: 800;
        cursor: pointer;
        transition:
          transform var(--transition-fast),
          border-color var(--transition-fast),
          background-color var(--transition-fast),
          box-shadow var(--transition-fast);
      }

      .player-input {
        width: clamp(180px, 20vw, 280px);
        cursor: text;
        justify-content: flex-start;
        outline: none;
        font-size: 16px;
      }

      .player-input::placeholder {
        color: rgba(255, 255, 255, 0.42);
      }

      .button-primary {
        border-color: rgba(255, 255, 255, 0.18);
        background: linear-gradient(180deg, #fff, #e9e9e9);
        color: #070707;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 16px 42px rgba(255, 255, 255, 0.08);
      }

      .button:hover,
      .file-button:hover {
        border-color: rgba(255, 255, 255, 0.34);
        transform: translateY(-1px);
      }

      .button-primary:hover {
        background: #fff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 1),
          0 20px 52px rgba(255, 255, 255, 0.1);
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .toggle-field {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        padding: 0 12px 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--text-muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .toggle-copy {
        color: rgba(255, 255, 255, 0.72);
        white-space: nowrap;
      }

      .toggle-control {
        position: relative;
        flex: 0 0 auto;
        width: 46px;
        height: 28px;
        margin: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        appearance: none;
        cursor: pointer;
        transition:
          background-color 220ms cubic-bezier(0.22, 1, 0.36, 1),
          border-color 220ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .toggle-control::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(232, 238, 245, 0.9);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.24),
          0 0 0 1px rgba(255, 255, 255, 0.04);
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 220ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .toggle-control:checked {
        border-color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.05);
      }

      .toggle-control:checked::after {
        transform: translateX(18px);
        background: #050505;
      }

      .speed-field {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .speed-field input[type="range"] {
        width: clamp(110px, 14vw, 160px);
        accent-color: #fff;
      }

      .speed-field input[type="range"]:disabled {
        opacity: 0.42;
      }

      @media (max-width: 760px) {
        .app-shell,
        .viewer-stage,
        #viewer-canvas {
          min-height: 100svh;
          height: var(--app-height, 100svh);
        }

        .viewer-topbar {
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
          gap: 10px;
          height: auto;
          padding:
            calc(12px + env(safe-area-inset-top, 0))
            calc(14px + env(safe-area-inset-right, 0))
            0
            calc(14px + env(safe-area-inset-left, 0));
        }

        .brand-block {
          min-width: 0;
        }

        .brand-mark {
          width: 34px;
          height: 34px;
        }

        .brand-copy strong {
          font-size: 1rem;
        }

        .brand-copy span {
          display: none;
        }

        #status {
          justify-self: start;
          max-width: calc(100vw - 28px - env(safe-area-inset-left, 0) - env(safe-area-inset-right, 0));
          padding: 7px 10px;
          border-radius: 12px;
          font-size: 0.74rem;
          white-space: normal;
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .control-dock {
          bottom: env(safe-area-inset-bottom, 0);
          width: 100%;
          max-height: min(56svh, 430px);
          padding:
            0
            calc(10px + env(safe-area-inset-right, 0))
            max(10px, env(safe-area-inset-bottom, 0))
            calc(10px + env(safe-area-inset-left, 0));
          overflow-y: auto;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }

        .control-pill {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: stretch;
          justify-content: stretch;
          gap: 8px;
          border-radius: 24px;
          padding: 12px;
          background: rgba(12, 13, 17, 0.84);
        }

        html[data-dock="open"] .dock-toggle {
          bottom: calc(min(56svh, 430px) + max(14px, env(safe-area-inset-bottom, 0)));
        }

        html[data-dock="closed"] .dock-toggle {
          bottom: calc(14px + env(safe-area-inset-bottom, 0));
        }

        .dock-toggle {
          right: calc(12px + env(safe-area-inset-right, 0));
          width: 48px;
          height: 48px;
          background: rgba(15, 16, 20, 0.78);
        }

        .button,
        .file-button,
        .player-input,
        .toggle-field,
        .speed-field {
          width: 100%;
          justify-content: space-between;
          min-height: 48px;
          border-radius: 16px;
          padding-right: 14px;
          padding-left: 14px;
        }

        .player-input,
        .button-primary,
        .speed-field {
          grid-column: 1 / -1;
        }

        .toggle-field,
        .speed-field {
          gap: 10px;
          font-size: 0.78rem;
        }

        .toggle-copy,
        .speed-field span {
          min-width: 0;
          overflow-wrap: anywhere;
          white-space: normal;
        }

        .speed-field input[type="range"] {
          width: min(48vw, 220px);
        }

        .button:hover,
        .file-button:hover,
        .button-primary:hover,
        .dock-toggle:hover {
          transform: none;
        }
      }

      @media (max-width: 380px) {
        .control-pill {
          grid-template-columns: 1fr;
        }

        .player-input,
        .button-primary,
        .speed-field {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="viewer-topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
          </div>
          <div class="brand-copy">
            <strong>Skinhelm</strong>
            <span>WebGL viewer</span>
          </div>
        </div>
        <span id="status" role="status" aria-live="polite">Starting viewer...</span>
      </header>

      <main class="viewer-stage">
        <canvas id="viewer-canvas"></canvas>
        <button
          id="dock-toggle"
          class="dock-toggle"
          type="button"
          aria-label="Toggle controls"
          title="Toggle controls"
        ></button>

        <section class="control-dock" aria-label="Viewer controls">
          <div class="control-pill">
            <input
              id="player-input"
              class="player-input"
              type="text"
              autocomplete="off"
              autocapitalize="none"
              enterkeyhint="go"
              spellcheck="false"
              placeholder="Username or UUID"
              aria-label="Minecraft username or UUID"
            />
            <button id="load-player" class="button button-primary" type="button">Load</button>
            <input id="skin-file" class="file-input" type="file" accept="image/png" />
            <label class="file-button" for="skin-file">Choose PNG</label>
            <input id="cape-file" class="file-input" type="file" accept="image/png" />
            <label class="file-button" for="cape-file">Choose Cape</label>
            <button id="load-default" class="button" type="button">Default</button>
            <button id="save-head" class="button" type="button">Save Head</button>

            <label class="toggle-field">
              <span class="toggle-copy">Outer layers</span>
              <input id="toggle-overlays" class="toggle-control" type="checkbox" checked />
            </label>
            <label class="toggle-field">
              <span class="toggle-copy">Cape</span>
              <input id="toggle-cape" class="toggle-control" type="checkbox" />
            </label>
            <label class="toggle-field">
              <span class="toggle-copy">Slim arms</span>
              <input id="toggle-slim" class="toggle-control" type="checkbox" />
            </label>
            <label class="toggle-field">
              <span class="toggle-copy">Experimental animation</span>
              <input id="toggle-animation" class="toggle-control" type="checkbox" />
            </label>
            <label class="speed-field">
              <span>Speed</span>
              <input
                id="animation-speed"
                type="range"
                min="0.1"
                max="3.0"
                step="0.1"
                value="1.0"
              />
            </label>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
