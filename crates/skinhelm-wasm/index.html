<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skinhelm-wasm</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #111316;
        color: #eef2f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: #1a1f25;
        border-bottom: 1px solid #303842;
      }

      label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
      }

      button,
      input[type="file"]::file-selector-button {
        border: 1px solid #3c4652;
        background: #242b34;
        color: #f5f7fa;
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
      }

      input[type="range"] {
        width: 120px;
      }

      main {
        position: relative;
        min-height: 0;
      }

      #viewer-canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 520px;
        background: #15191e;
        touch-action: none;
      }

      #status {
        min-width: 220px;
        color: #aeb9c5;
      }
    </style>
  </head>
  <body>
    <header>
      <input id="skin-file" type="file" accept="image/png" />
      <button id="load-default" type="button">Load default</button>
      <label>
        <input id="toggle-animation" type="checkbox" checked />
        Animation
      </label>
      <label>
        <input id="toggle-overlays" type="checkbox" checked />
        Outer layers
      </label>
      <label>
        Speed
        <input id="animation-speed" type="range" min="0.1" max="3.0" step="0.1" value="1.0" />
      </label>
      <span id="status">Starting viewer...</span>
    </header>
    <main>
      <canvas id="viewer-canvas"></canvas>
    </main>
    <script type="module" src="/bootstrap.js"></script>
  </body>
</html>
